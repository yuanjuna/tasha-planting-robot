[platformio]
default_envs = manual_car_control

[env]
platform = ststm32
board = black_f407zg
framework = stm32cube
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
build_unflags = -Os
build_flags =
    -Iinclude
    -DSTM32F407xx
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000U
    -mcpu=cortex-m4
    -mthumb
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
extra_scripts = pre:freertos_sources.py
build_src_filter =
    +<*>
    -<diag/main_*_test.c>

; ALIENTEK 4.3 inch portrait screen, NT35510 / 0x5510
[env:nt35510_slow]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x5510

; Auto-detect LCD ID
[env:auto_slow]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0

; SSD1963 landscape module
[env:ssd1963_slow]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x1963

; Detected on this board: ILI9806 / 0x9806
[env:ili9806_slow]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806

; Full integrated workflow: LCD, FreeRTOS, car, steppers, actuators, pump,
; radar UART, IMU, ultrasonic, display refresh, and RC work switch.
[env:all_features]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DAPP_USE_FREERTOS=0
    -DMONITOR_ONLY=1
    -DWORK_RC_SWITCH_ENABLE=1

; USART1 hardware echo diagnostic: PA10 RX -> PA9 TX, 115200 8N1.
[env:uart1_echo_only]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DUART1_ECHO_ONLY=1

; Moving device stepper diagnostic: PC11 STEP / PC12 DIR.
[env:mobile_test_only]
build_src_filter =
    +<*>
    -<diag/main_*_test.c>
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DMOBILE_TEST_ONLY=1

; Stepper diagnostic on seedling pins for comparison: PB0 STEP / PB1 DIR.
[env:seedling_test_only]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DSEEDLING_TEST_ONLY=1

; Seedling and moving steppers run together.
[env:dual_steppers_test]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DDUAL_STEPPERS_TEST=1

; Conveyor diagnostic: PG6/PG7 forward-stop-reverse-stop loop.
[env:conveyor_test_only]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DCONVEYOR_TEST_ONLY=1

; Electric drill and drill rod diagnostic.
[env:drill_rod_test_only]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DDRILL_ROD_TEST_ONLY=1

; Electric drill only diagnostic: PG2/PG3 on 5s, off 2s loop.
[env:drill_test_only]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DDRILL_TEST_ONLY=1

; 12V linear actuator GPIO diagnostic: PA0=EN, PA1=PWM1, PG2=PWM2.
[env:linear_actuator_test_only]
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DLINEAR_ACTUATOR_TEST_ONLY=1

; PG4/PG5 telescopic rod diagnostic: extend 5s, stop 2s, retract 5s, stop 2s loop.
[env:linear_pg45_test]
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DLINEAR_ACTUATOR_PG4_PG5_TEST_ONLY=1

; PB8 GPIO diagnostic: PB8 high 1s, low 1s loop.
[env:pb8_toggle_test_only]
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DPB8_TOGGLE_TEST_ONLY=1

; PC10 electric drill relay diagnostic: on 10s, off 2s loop.
[env:pc10_drill_test_only]
build_src_filter =
    +<*>
    -<diag/main_*_test.c>
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DPUMP_TEST_ONLY=1

; Compatibility alias for the old PC10 relay diagnostic name.
[env:pump_test_only]
build_src_filter =
    +<*>
    -<diag/main_*_test.c>
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DPUMP_TEST_ONLY=1

; Soil-covering device diagnostic: PC8/PC9 forward-stop-reverse-stop loop.
[env:cover_test_only]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DCOVER_TEST_ONLY=1

; Car PWM diagnostic: forward 10s, stop 2s, reverse 10s, stop 2s loop.
[env:car_test_only]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DCAR_TEST_ONLY=1

; IMU diagnostic: use the same IMU scan/read/display path as the integrated workflow.
[env:imu_test_only]
build_src_filter =
    +<*>
    -<diag/main_*_test.c>
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DAPP_USE_FREERTOS=0
    -DIMU_TEST_ONLY=1

; Car + IMU row-change diagnostic.
[env:car_imu_row_test]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DAPP_USE_FREERTOS=0
    -DWORK_RC_SWITCH_ENABLE=1
    -DCAR_IMU_ROW_TEST=1

; Car manual/auto diagnostic only: SWB run/pause, pause enables manual RC.
[env:car_manual_auto_test_only]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DAPP_USE_FREERTOS=0
    -DCAR_MANUAL_AUTO_TEST_ONLY=1

; Main tested robot program: manual car control, automatic workflow, speed gears, and LCD gear display.
; CH1 PA0/TIM2_CH1, CH2 PC6/TIM8_CH1, direction GPIOs:
; left PA5/PB1, right PB12/PA6. Speed PWM outputs are PD12/PD13 through the 5V level shifter.
; Water pump: PE5 -> L298N IN1, IN2 -> GND, ENA jumper installed. PE5 high = run.
[env:manual_car_control]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DAPP_USE_FREERTOS=0
    -DIMU_TEST_ONLY=1
    -DCAR_GPIO_MANUAL_TEST_ONLY=1

; Car motor GPIO pin diagnostic.
; Tests one active-low motor control pin at a time:
; 1 blink = PA7, 2 blinks = PB1, 3 blinks = PB12, 4 blinks = PA6.
[env:car_pin_diag_test]
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DCAR_PIN_DIAG_TEST_ONLY=1

; Left motor driver diagnostic.
; Tests PA7/PB1 combinations only:
; 1 blink = PA7 low, PB1 high; 2 blinks = PA7 high, PB1 low;
; 3 blinks = PA7 low, PB1 low; 4 blinks = PA7 high, PB1 high.
[env:car_left_diag_test]
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DCAR_LEFT_DIAG_TEST_ONLY=1

; Car turn diagnostic.
; Loops right turn 4s, stop 2s, left turn 4s, stop 2s using GPIO motor outputs.
[env:car_turn_test_only]
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DCAR_TURN_TEST_ONLY=1

; PB0 seedling step pulse diagnostic.
; Cycles four pulse speeds. PF9 blinks 1/2/3/4 before each test;
; PF10 lights while PB0 is outputting 125 active-low pulses.
[env:servo51_pb0_diag_test]
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DSERVO51_PB0_DIAG_TEST_ONLY=1

; Servo 360-degree 13-step standalone diagnostic: PB6 / TIM4_CH1.
; This environment builds only src/main_servo_13_test.c and does not run the
; planting robot workflow, LCD UI, car, pump, steppers, drill, or conveyor code.
[env:servo_13_test]
build_src_filter =
    +<diag/main_servo_13_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DSERVO_13_TEST=1

; Minimal servo PWM diagnostic: PB6 / TIM4_CH1.
; Builds only src/main_servo_basic_test.c and does not run the robot workflow.
[env:servo_basic_test]
build_src_filter =
    +<diag/main_servo_basic_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DSERVO_BASIC_TEST=1

; S3003 standard 0..180 degree servo diagnostic: PB6 / TIM4_CH1.
; Builds only src/main_servo_s3003_test.c and does not run the robot workflow.
[env:servo_s3003_test]
build_src_filter =
    +<diag/main_servo_s3003_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DSERVO_S3003_TEST=1

; MG996R/MG995 metal servo PWM diagnostic: PB6 / TIM4_CH1.
; Builds only src/main_mg996r_pwm_test.c and does not run the robot workflow.
[env:mg996r_pwm_test]
build_src_filter =
    +<diag/main_mg996r_pwm_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DMG996R_PWM_TEST=1

; Minimal MG996R servo movement test: PB6 / TIM4_CH1.
; Builds only src/main_mg996r_min_test.c and does not run the robot workflow.
[env:mg996r_min_test]
build_src_filter =
    +<diag/main_mg996r_min_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DMG996R_MIN_TEST=1

; MG996R multi-pin hardware PWM test: PB6/PB7/PB8/PB9 = TIM4_CH1..CH4.
; Builds only src/main_mg996r_multi_pin_test.c and does not run the robot workflow.
[env:mg996r_multi_pin_test]
build_src_filter =
    +<diag/main_mg996r_multi_pin_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DMG996R_MULTI_PIN_TEST=1

; MG996R multi-pin software PWM fallback: PB6/PB7/PB8/PB9 GPIO output.
; Builds only src/main_mg996r_soft_pwm_test.c and does not run the robot workflow.
[env:mg996r_soft_pwm_test]
build_src_filter =
    +<diag/main_mg996r_soft_pwm_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DMG996R_SOFT_PWM_TEST=1

; MG996R visible swing test: PB6 / TIM4_CH1.
; Builds only src/main_mg996r_swing_test.c and does not run the robot workflow.
[env:mg996r_swing_test]
build_src_filter =
    +<diag/main_mg996r_swing_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DMG996R_SWING_TEST=1

; MG996R GPIO-only software PWM test: PB6/PB7/PB8/PB9.
; Builds only src/main_mg996r_gpio_pwm_test.c and does not use TIM4 PWM.
[env:mg996r_gpio_pwm_test]
build_src_filter =
    +<diag/main_mg996r_gpio_pwm_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DMG996R_GPIO_PWM_TEST=1

; 28BYJ-48 + ULN2003 standalone test: PB6/PB7/PB8/PB9 = IN1..IN4.
; Builds only src/main_stepper_28byj48_test.c and does not run the robot workflow.
[env:stepper_28byj48_test]
build_src_filter =
    +<diag/main_stepper_28byj48_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DSTEPPER_28BYJ48_TEST=1

; 28BYJ-48 + ULN2003 PC0..PC3 alternate pin test.
; Stage 1 default: slow IN1..IN4 LED test. Set STEPPER_TEST_STAGE=2 for motion.
[env:stepper_28byj48_altpins_test]
build_src_filter =
    +<diag/main_stepper_28byj48_altpins_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DSTEPPER_28BYJ48_ALTPINS_TEST=1
    -DSTEPPER_TEST_STAGE=1

; Final MG996R/servo PWM test: PA0 / TIM2_CH1, 50Hz hardware PWM.
; Builds only src/main_servo_pwm_final_test.c and does not run the robot workflow.
[env:servo_pwm_final_test]
build_src_filter =
    +<diag/main_servo_pwm_final_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DSERVO_PWM_FINAL_TEST=1

; Servo force-rotate GPIO software PWM test: PA0/PA1/PA2/PA3.
; Builds only src/main_servo_force_rotate_test.c and does not use hardware PWM.
[env:servo_force_rotate_test]
build_src_filter =
    +<diag/main_servo_force_rotate_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DSERVO_FORCE_ROTATE_TEST=1

; Wave output diagnostic, software PWM on PA0/PA1/PA2/PA3.
; USART1 PA9/PA10 is used for status prints so PA2/PA3 stay available.
[env:pwm_wave_soft_test]
build_src_filter =
    +<diag/main_pwm_wave_soft_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DPWM_WAVE_SOFT_TEST=1

; Wave output diagnostic, TIM2 hardware PWM on PA0/PA1/PA2/PA3.
; PA0=CH1, PA1=CH2, PA2=CH3, PA3=CH4.
[env:pwm_wave_tim2_test]
build_src_filter =
    +<diag/main_pwm_wave_tim2_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DPWM_WAVE_TIM2_TEST=1

; PA1 1000Hz 50% hardware PWM test: PA1 / TIM2_CH2.
[env:pa1_1khz_pwm_test]
build_src_filter =
    +<diag/main_pa1_1khz_pwm_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DPA1_1KHZ_PWM_TEST=1

; Dual motor speed PWM test: PD12/TIM4_CH1 = 1000Hz 30% duty,
; PD13/TIM4_CH2 = 1000Hz 90% duty. Verified through 5V level shifter.
; Builds only src/main_dual_motor_pwm_1khz_30_test.c and does not run the robot workflow.
[env:dual_motor_pwm_1khz_30_test]
build_src_filter =
    +<diag/main_dual_motor_pwm_1khz_30_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DDUAL_MOTOR_PWM_1KHZ_30_TEST=1

; Servo test using confirmed PA1 PWM pin: PA1 / TIM2_CH2, 50Hz.
[env:servo_pa1_pwm_test]
build_src_filter =
    +<diag/main_servo_pa1_pwm_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DSERVO_PA1_PWM_TEST=1

; Servo 13-step one-turn timing test using confirmed PA1 PWM pin.
[env:servo_pa1_13_step_test]
build_src_filter =
    +<diag/main_servo_pa1_13_step_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DSERVO_PA1_13_STEP_TEST=1

; Servo documentation example port: PA1 / TIM2_CH2, 0..180 degree sweep.
[env:servo_doc_pa1_test]
build_src_filter =
    +<diag/main_servo_doc_pa1_test.c>
build_flags =
    ${env.build_flags}
    -DAPP_USE_FREERTOS=0
    -DSERVO_DOC_PA1_TEST=1

; Monitor only: refresh LCD/RC/radar/IMU/ultrasonic without running actuators.
[env:monitor_only]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x9806
    -DMONITOR_ONLY=1

; ST7796
[env:st7796_slow]
build_flags =
    ${env.build_flags}
    -DLCD_FORCE_ID=0x7796
